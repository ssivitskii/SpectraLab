server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  error_page 413 = @body_too_large;
  location @body_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"request_too_large","message":"Request body exceeds configured limit","details":null}}';
  }
  location /api/ { proxy_pass http://backend:8000; }
  location /docs { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
