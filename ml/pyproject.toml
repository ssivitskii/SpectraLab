[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spectralab-ml"
version = "0.1.0"
description = "Synthetic atomic-emission spectrum research toolkit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.2",
  "matplotlib==3.10.6",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
]

[project.optional-dependencies]
notebooks = ["ipykernel==7.0.1", "jupyterlab==4.4.9"]

[project.scripts]
spectralab = "spectralab_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectralab_ml"]
