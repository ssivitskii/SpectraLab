<text x="32" y="44" font-size="15" fill="#7747CB" font-weight="700" letter-spacing="1.6">INTERACTIVE ANALYSIS</text>
<rect x="32" y="68" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="50" y="92" font-size="13" fill="#7747CB" font-weight="700" >01</text>
<text x="50" y="123" font-size="23" fill="#2D214F" font-weight="650" >React workbench</text>
<text x="50" y="151" font-size="17" fill="#65557E" font-weight="400" >Generate / upload</text>
<text x="50" y="174" font-size="17" fill="#65557E" font-weight="400" >Inspect spectra</text>
