<rect x="320" y="68" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="338" y="92" font-size="13" fill="#7747CB" font-weight="700" >02</text>
<text x="338" y="123" font-size="23" fill="#2D214F" font-weight="650" >FastAPI</text>
<text x="338" y="151" font-size="17" fill="#65557E" font-weight="400" >Validate inputs</text>
<text x="338" y="174" font-size="17" fill="#65557E" font-weight="400" >Resolve model registry</text>
<path d="M584 130H600" fill="none" stroke="#7747CB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="608" y="68" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="626" y="92" font-size="13" fill="#7747CB" font-weight="700" >03</text>
<text x="626" y="123" font-size="23" fill="#2D214F" font-weight="650" >ML inference</text>
<text x="626" y="151" font-size="17" fill="#65557E" font-weight="400" >Preprocess + features</text>
<text x="626" y="174" font-size="17" fill="#65557E" font-weight="400" >Scores + thresholds</text>
<path d="M872 130H888" fill="none" stroke="#7747CB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="896" y="68" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="914" y="92" font-size="13" fill="#7747CB" font-weight="700" >04</text>
<text x="914" y="123" font-size="23" fill="#2D214F" font-weight="650" >Inspect &amp; export</text>
<text x="914" y="151" font-size="17" fill="#65557E" font-weight="400" >API-managed history</text>
<text x="914" y="174" font-size="17" fill="#65557E" font-weight="400" >JSON / CSV / ZIP</text>
<text x="32" y="237" font-size="15" fill="#7747CB" font-weight="700" letter-spacing="1.6">BACKGROUND EXPERIMENTS</text>
<rect x="32" y="261" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="50" y="285" font-size="13" fill="#7747CB" font-weight="700" >01</text>
<text x="50" y="316" font-size="23" fill="#2D214F" font-weight="650" >API job request</text>
<text x="50" y="344" font-size="17" fill="#65557E" font-weight="400" >Create durable record</text>
<text x="50" y="367" font-size="17" fill="#65557E" font-weight="400" >Local file-backed queue</text>
<path d="M296 323H312" fill="none" stroke="#7747CB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="320" y="261" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
