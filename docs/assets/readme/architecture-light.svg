<text x="626" y="316" font-size="23" fill="#2D214F" font-weight="650" >ML experiment</text>
<text x="626" y="344" font-size="17" fill="#65557E" font-weight="400" >Simulate, fit, evaluate</text>
<text x="626" y="367" font-size="17" fill="#65557E" font-weight="400" >Grouped data splits</text>
<path d="M872 323H888" fill="none" stroke="#7747CB" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="896" y="261" width="260" height="123" rx="12" fill="#ECE5FA" stroke="#DDD0F1"/>
<text x="914" y="285" font-size="13" fill="#7747CB" font-weight="700" >04</text>
<text x="914" y="316" font-size="23" fill="#2D214F" font-weight="650" >Stored runs</text>
<text x="914" y="344" font-size="17" fill="#65557E" font-weight="400" >Metrics + provenance</text>
<text x="914" y="367" font-size="17" fill="#65557E" font-weight="400" >UI reads API reports</text>
<path d="M32 419H1168" stroke="#DDD0F1"/>
<text x="32" y="451" font-size="17" fill="#65557E" font-weight="400" >One researcher, one local machine. Synthetic results and measured-instrument studies stay separate.</text>
