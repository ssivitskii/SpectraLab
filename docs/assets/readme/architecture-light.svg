<text x="338" y="316" font-size="23" fill="#2D214F" font-weight="650" >Local worker</text>
<text x="338" y="344" font-size="17" fill="#65557E" font-weight="400" >Host-local lock</text>
<text x="338" y="367" font-size="17" fill="#65557E" font-weight="400" >Bounded subprocess</text>
<path d="M584 323H600" fill="none" stroke="#7747CB" stroke-width="2" marker-end="url(#arrow)"/>
